name: Weekly Digital Demand Pulse

# Every Monday: pull the week's Wikipedia pageviews, re-run the checks, rebuild the report (page data, Excel workbook,
# weekly note) and commit it; Vercel redeploys the site from the commit. A failed check stops the job before anything
# is committed, so a broken week is never published.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch, check and report
        run: |
          PYTHONPATH=src python -m dp.fetch
          PYTHONPATH=src python -m dp.analyse
          PYTHONPATH=src python -m pytest -q
      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw site/public reports excel
          if ! git diff --cached --quiet; then
            git commit -m "Weekly Digital Demand Pulse"
            git push
          fi
